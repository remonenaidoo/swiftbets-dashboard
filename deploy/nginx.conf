server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  set $csp "default-src 'self'; script-src 'nonce-$request_id' 'strict-dynamic'; style-src 'self' 'nonce-$request_id'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'";

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
    sub_filter_once off;
    sub_filter_types text/html;
    sub_filter '__CSP_NONCE__' $request_id;
    add_header Content-Security-Policy $csp always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }
}
